[package]
name = "rk-mpp-rs"
version = "0.1.0"
edition = "2021"
description = "Pure-Rust Rockchip MPP codec SDK and RGA replacement"
license = "MIT OR Apache-2.0"

[workspace]
members = ["crates/rk-mpp-rs-sys"]
default-members = ["."]
resolver = "2"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
name = "rk_mpp_rs"

[[bin]]
name = "rk-mpp-rs"
path = "src/main.rs"

[dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
